<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Work To-Do App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef4ff, #f7f0ff);
            margin: 0;
            padding: 32px;
            color: #223;
            font-size: 18px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 36px;
            border-radius: 20px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.12);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #4b3f72;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 2fr 1.2fr 1.2fr 1fr 0.9fr;
            gap: 12px;
            margin-bottom: 24px;
            align-items: end;
        }

        .form-grid>div {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-weight: 600;
            font-size: 16px;
        }

        input,
        select {
            padding: 14px 12px;
            font-size: 18px;
            border: 1px solid #d7dce5;
            border-radius: 12px;
            min-height: 48px;
        }

        button {
            padding: 14px 18px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #4f7cff, #6a8dff);
            color: white;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            min-height: 48px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid #eee;
            font-size: 20px;
        }

        .task-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
            flex: 1;
            border-radius: 10px;
            padding: 6px 8px;
        }

        .task-info:focus-visible {
            outline: 2px solid #4f7cff;
            outline-offset: 3px;
        }

        .done {
            text-decoration: line-through;
            color: gray;
        }

        .priority-high,
        .priority-immediate-action {
            color: #d14343;
            font-weight: bold;
        }

        .priority-medium {
            color: #d28a00;
            font-weight: bold;
        }

        .priority-low {
            color: #2e8b57;
            font-weight: bold;
        }

        .actions button {
            margin-left: 6px;
            background: #e74c3c;
        }

        @media (max-width: 900px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 24px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="logo">Your Workspace</div>
            <div>Task Board</div>
        </div>

        <form id="taskForm" class="form-grid">
            <div>
                <label for="taskInput">Task</label>
                <input id="taskInput" name="taskInput" placeholder="Add a work task..." required />
            </div>
            <div>
                <label for="prioritySelect">Priority</label>
                <select id="prioritySelect" name="prioritySelect">
                    <option value="low">Low Priority</option>
                    <option value="medium">Medium Priority</option>
                    <option value="high">High Priority</option>
                    <option value="immediate-action">Immediate Action</option>
                </select>
            </div>
            <div>
                <label for="categorySelect">Category</label>
                <select id="categorySelect" name="categorySelect">
                    <option value="General">General</option>
                    <option value="Study">Study</option>
                    <option value="Projects">Projects</option>
                    <option value="Work">Work</option>
                    <option value="Personal">Personal</option>
                </select>
            </div>
            <div>
                <label for="dueDateInput">Due date</label>
                <input id="dueDateInput" name="dueDateInput" type="date" />
            </div>
            <button type="submit">Add Task</button>
        </form>
        <ul id="taskList"></ul>
    </div>

    <script>
        const taskForm = document.getElementById('taskForm');
        const taskInput = document.getElementById('taskInput');
        const prioritySelect = document.getElementById('prioritySelect');
        const categorySelect = document.getElementById('categorySelect');
        const dueDateInput = document.getElementById('dueDateInput');
        const taskList = document.getElementById('taskList');
        const STORAGE_KEY = 'myk-task-list';

        function normalizePriorityValue(value) {
            const normalized = String(value || 'low').trim().toLowerCase().replace(/\s+/g, '-');
            return ['low', 'medium', 'high', 'immediate-action'].includes(normalized) ? normalized : 'low';
        }

        function getPriorityLabel(value) {
            const normalized = normalizePriorityValue(value);
            const labels = {
                low: 'Low',
                medium: 'Medium',
                high: 'High',
                'immediate-action': 'Immediate Action'
            };
            return labels[normalized] || 'Low';
        }

        function normalizePriorityClass(value) {
            return 'priority-' + normalizePriorityValue(value);
        }

        function createTextSpan(className, text) {
            const span = document.createElement('span');
            span.className = className;
            span.textContent = text;
            return span;
        }

        function renderTask(task) {
            const li = document.createElement('li');
            li.dataset.id = task.id || String(Date.now() + Math.random().toString(16).slice(2));
            li.dataset.priority = normalizePriorityValue(task.priority);
            li.dataset.category = task.category || 'General';
            li.dataset.duedate = task.dueDate || '';
            if (task.done) {
                li.classList.add('done');
            }

            const info = document.createElement('div');
            info.className = 'task-info';
            info.tabIndex = 0;
            info.setAttribute('role', 'button');
            info.setAttribute('aria-pressed', String(!!task.done));

            const strong = document.createElement('strong');
            strong.textContent = task.text;

            const prioritySpan = createTextSpan('priority', `${getPriorityLabel(task.priority)} Priority`);
            prioritySpan.classList.add(normalizePriorityClass(task.priority));

            const categorySpan = createTextSpan('category', `Category: ${task.category || 'General'}`);
            const dueSpan = createTextSpan('due-date', `Due: ${task.dueDate || 'No date'}`);

            info.append(strong, prioritySpan, categorySpan, dueSpan);

            const actions = document.createElement('span');
            actions.className = 'actions';

            const removeBtn = document.createElement('button');
            removeBtn.type = 'button';
            removeBtn.className = 'remove-btn';
            removeBtn.textContent = 'Remove';
            removeBtn.setAttribute('aria-label', `Remove ${task.text}`);

            actions.appendChild(removeBtn);
            li.append(info, actions);
            taskList.appendChild(li);
        }

        function getTasksFromDOM() {
            return Array.from(taskList.children).map((li) => ({
                id: li.dataset.id,
                text: li.querySelector('strong')?.textContent || '',
                priority: li.dataset.priority || 'low',
                category: li.dataset.category || 'General',
                dueDate: li.dataset.duedate || '',
                done: li.classList.contains('done')
            }));
        }

        function saveTasks() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(getTasksFromDOM()));
        }

        function toggleTaskDone(li) {
            li.classList.toggle('done');
            const info = li.querySelector('.task-info');
            if (info) {
                info.setAttribute('aria-pressed', String(li.classList.contains('done')));
            }
            saveTasks();
        }

        function addTask() {
            const taskText = taskInput.value.trim();
            if (!taskText) return;

            const task = {
                id: String(Date.now()),
                text: taskText,
                priority: prioritySelect.value,
                category: categorySelect.value,
                dueDate: dueDateInput.value,
                done: false
            };

            renderTask(task);
            saveTasks();
            taskForm.reset();
            prioritySelect.value = 'low';
            categorySelect.value = 'General';
            taskInput.focus();
        }

        taskForm.addEventListener('submit', (event) => {
            event.preventDefault();
            addTask();
        });

        taskList.addEventListener('click', (event) => {
            const removeButton = event.target.closest('.remove-btn');
            if (removeButton) {
                const li = removeButton.closest('li');
                if (li) {
                    li.remove();
                    saveTasks();
                }
                return;
            }

            const info = event.target.closest('.task-info');
            if (info) {
                toggleTaskDone(info.closest('li'));
            }
        });

        taskList.addEventListener('keydown', (event) => {
            const info = event.target.closest('.task-info');
            if (!info) return;

            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                toggleTaskDone(info.closest('li'));
            }
        });

        function loadTasks() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (!saved) return;

            try {
                const tasks = JSON.parse(saved);
                if (!Array.isArray(tasks)) return;
                tasks.forEach((task) => renderTask(task));
            } catch (error) {
                console.error('Failed to parse tasks', error);
            }
        }

        loadTasks();
    </script>
</body>

</html>
