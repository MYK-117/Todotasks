<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MYK Workspace Task Board</title>
    <style>
        :root {
            --bg: #f4f7ff;
            --panel: #ffffff;
            --panel-2: #f8faff;
            --text: #223049;
            --muted: #68728d;
            --primary: #4f7cff;
            --primary-2: #6a8dff;
            --danger: #e74c3c;
            --success: #2e8b57;
            --warning: #d28a00;
            --overdue: #c33a3a;
            --border: #e6ebf5;
            --shadow: 0 16px 40px rgba(17, 29, 74, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef4ff, #f7f0ff);
            color: var(--text);
            font-size: 16px;
        }

        .app-shell {
            display: grid;
            grid-template-columns: 260px 1fr;
            min-height: 100vh;
            padding: 24px;
            gap: 20px;
        }

        .sidebar {
            background: var(--panel);
            border-radius: 24px;
            padding: 24px 18px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .brand {
            font-size: 24px;
            font-weight: 800;
            color: #4b3f72;
            margin-bottom: 4px;
        }

        .brand-subtitle {
            color: var(--muted);
            font-size: 14px;
        }

        .sidebar-section h3 {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--muted);
            margin: 0 0 10px;
        }

        .nav-btn,
        .category-btn {
            width: 100%;
            text-align: left;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text);
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .nav-btn.active,
        .category-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            color: white;
            box-shadow: 0 10px 22px rgba(79, 124, 255, 0.2);
        }

        .main-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .hero,
        .task-panel,
        .controls-panel {
            background: var(--panel);
            border-radius: 24px;
            box-shadow: var(--shadow);
            padding: 22px;
        }

        .hero {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .hero h1 {
            margin: 0 0 6px;
            font-size: 28px;
        }

        .hero p {
            margin: 0;
            color: var(--muted);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(110px, 1fr));
            gap: 10px;
            flex: 1;
            min-width: 320px;
        }

        .stat-card {
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 12px;
        }

        .stat-card .label {
            font-size: 12px;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 6px;
            letter-spacing: 0.08em;
        }

        .stat-card .value {
            font-size: 22px;
            font-weight: 800;
        }

        .controls-panel {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr 0.9fr;
            gap: 10px;
            align-items: end;
        }

        input,
        select,
        button {
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            font-size: 15px;
            font-family: inherit;
        }

        button {
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            color: #fff;
            border: none;
            cursor: pointer;
            font-weight: 700;
        }

        button:hover {
            filter: brightness(1.05);
        }

        .controls-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .task-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .task-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .summary {
            color: var(--muted);
            font-size: 14px;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        li {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            justify-content: space-between;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 12px 14px;
            background: #fcfdff;
        }

        .task-toggle {
            margin-top: 2px;
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
            flex: 0 0 auto;
        }

        .task-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            min-width: 0;
        }

        .task-title {
            font-weight: 700;
            word-break: break-word;
        }

        .task-meta {
            font-size: 14px;
            color: var(--muted);
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .done .task-title {
            text-decoration: line-through;
            color: gray;
            opacity: 0.85;
        }

        .priority-low {
            color: var(--success);
            font-weight: 700;
        }

        .priority-medium {
            color: var(--warning);
            font-weight: 700;
        }

        .priority-high {
            color: var(--overdue);
            font-weight: 700;
        }

        .priority-immediate {
            color: #8b0000;
            font-weight: 800;
        }

        .priority-unknown {
            color: var(--muted);
            font-weight: 700;
        }

        .actions {
            display: flex;
            gap: 6px;
            flex: 0 0 auto;
        }

        .actions button {
            background: #eef1f6;
            color: #334;
            border: none;
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .actions .remove-btn {
            background: var(--danger);
            color: white;
        }

        .due-overdue {
            color: var(--overdue);
            font-weight: 700;
        }

        .empty-state {
            text-align: center;
            padding: 28px 12px;
            color: var(--muted);
            background: #fcfdff;
            border: 1px dashed var(--border);
            border-radius: 16px;
        }

        .edit-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            width: 100%;
        }

        .edit-row input,
        .edit-row select {
            flex: 1 1 140px;
        }

        .sr-only {
            position: absolute;
            left: -9999px;
            top: auto;
            width: 1px;
            height: 1px;
            overflow: hidden;
        }

        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        [tabindex]:focus-visible {
            outline: 3px solid var(--primary);
            outline-offset: 2px;
        }

        @media (max-width: 980px) {
            .app-shell {
                grid-template-columns: 1fr;
            }

            .sidebar {
                order: 2;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                min-width: 0;
            }

            .form-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 640px) {
            body {
                font-size: 15px;
            }

            .app-shell {
                padding: 14px;
            }

            .hero,
            .controls-panel,
            .task-panel,
            .sidebar {
                padding: 16px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="app-shell">
        <aside class="sidebar" aria-label="Task views">
            <div>
                <div class="brand">MYK Workspace</div>
                <div class="brand-subtitle">Plan, organize, and track work</div>
            </div>

            <div class="sidebar-section">
                <h3>Views</h3>
                <button class="nav-btn active" data-view="all">All Tasks</button>
                <button class="nav-btn" data-view="today">Today</button>
                <button class="nav-btn" data-view="upcoming">Upcoming</button>
                <button class="nav-btn" data-view="overdue">Overdue</button>
            </div>

            <div class="sidebar-section">
                <h3>Categories</h3>
                <button class="category-btn active" data-category="">All Categories</button>
                <button class="category-btn" data-category="General">General</button>
                <button class="category-btn" data-category="Study">Study</button>
                <button class="category-btn" data-category="Projects">Projects</button>
                <button class="category-btn" data-category="Work">Work</button>
                <button class="category-btn" data-category="Personal">Personal</button>
            </div>
        </aside>

        <main class="main-panel">
            <section class="hero">
                <div>
                    <h1>Task Dashboard</h1>
                    <p>Keep your work organized with clear priorities and deadlines.</p>
                </div>
                <div class="stats-grid" id="statsGrid">
                    <div class="stat-card">
                        <div class="label">Total</div>
                        <div class="value" id="statTotal">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">Active</div>
                        <div class="value" id="statActive">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">Completed</div>
                        <div class="value" id="statDone">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">Overdue</div>
                        <div class="value" id="statOverdue">0</div>
                    </div>
                </div>
            </section>

            <section class="controls-panel">
                <form id="taskForm" class="form-grid" aria-label="Add a task">
                    <label class="sr-only" for="taskInput">Task description</label>
                    <input id="taskInput" type="text" placeholder="Add a work task..." required />

                    <label class="sr-only" for="prioritySelect">Priority</label>
                    <select id="prioritySelect">
                        <option value="Low">Low Priority</option>
                        <option value="Medium">Medium Priority</option>
                        <option value="High">High Priority</option>
                        <option value="Immediate Action">Immediate Action</option>
                    </select>

                    <label class="sr-only" for="categorySelect">Category</label>
                    <select id="categorySelect">
                        <option value="General">General</option>
                        <option value="Study">Study</option>
                        <option value="Projects">Projects</option>
                        <option value="Work">Work</option>
                        <option value="Personal">Personal</option>
                    </select>

                    <label class="sr-only" for="dueDateInput">Due date</label>
                    <input id="dueDateInput" type="date" />

                    <button type="submit">Add Task</button>
                </form>

                <div class="controls-row">
                    <label class="sr-only" for="filterDone">Status</label>
                    <select id="filterDone" aria-label="Filter by completion">
                        <option value="all">All</option>
                        <option value="active">Active</option>
                        <option value="done">Done</option>
                    </select>

                    <label class="sr-only" for="sortBy">Sort by</label>
                    <select id="sortBy" aria-label="Sort by">
                        <option value="created">Newest first</option>
                        <option value="due">Due date</option>
                        <option value="priority">Priority</option>
                    </select>

                    <button id="clearBtn" type="button">Clear Completed</button>
                    <button id="exportBtn" type="button">Export</button>
                    <input id="importFile" type="file" accept="application/json" style="display:none" />
                    <button id="importBtn" type="button">Import</button>
                </div>
            </section>

            <section class="task-panel">
                <div class="task-panel-header">
                    <div id="summary" class="summary" aria-live="polite"></div>
                    <div id="currentViewLabel" class="summary"></div>
                </div>
                <ul id="taskList" aria-live="polite" aria-label="Tasks"></ul>
            </section>
        </main>
    </div>

    <script>
        (function () {
            const STORAGE_KEY = 'myk-task-list-v3';
            const FILTER_KEY = 'myk-task-dashboard-v1';

            const taskForm = document.getElementById('taskForm');
            const taskInput = document.getElementById('taskInput');
            const prioritySelect = document.getElementById('prioritySelect');
            const categorySelect = document.getElementById('categorySelect');
            const dueDateInput = document.getElementById('dueDateInput');
            const taskList = document.getElementById('taskList');
            const filterDone = document.getElementById('filterDone');
            const sortBy = document.getElementById('sortBy');
            const clearBtn = document.getElementById('clearBtn');
            const exportBtn = document.getElementById('exportBtn');
            const importBtn = document.getElementById('importBtn');
            const importFile = document.getElementById('importFile');
            const summaryEl = document.getElementById('summary');
            const currentViewLabel = document.getElementById('currentViewLabel');
            const statTotal = document.getElementById('statTotal');
            const statActive = document.getElementById('statActive');
            const statDone = document.getElementById('statDone');
            const statOverdue = document.getElementById('statOverdue');

            const VALID_PRIORITIES = ['Low', 'Medium', 'High', 'Immediate Action'];
            const VALID_CATEGORIES = ['General', 'Study', 'Projects', 'Work', 'Personal'];
            const PRIORITY_ORDER = { 'Immediate Action': 0, 'High': 1, 'Medium': 2, 'Low': 3 };

            let tasks = [];
            let state = {
                view: 'all',
                category: '',
                done: 'all',
                sort: 'created'
            };

            const priorityClassMap = {
                Low: 'priority-low',
                Medium: 'priority-medium',
                High: 'priority-high',
                'Immediate Action': 'priority-immediate'
            };

            function uid() {
                return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
            }

            function parseDate(value) {
                if (!value) return null;
                const d = new Date(value + 'T00:00:00');
                return Number.isNaN(d.getTime()) ? null : d;
            }

            function isToday(value) {
                const d = parseDate(value);
                if (!d) return false;
                const now = new Date();
                return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
            }

            function isUpcoming(value) {
                const d = parseDate(value);
                if (!d) return false;
                const now = new Date();
                now.setHours(0, 0, 0, 0);
                return d > now;
            }

            function isOverdue(value, done) {
                if (done) return false;
                const d = parseDate(value);
                if (!d) return false;
                const now = new Date();
                now.setHours(0, 0, 0, 0);
                return d < now;
            }

            function persist() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
                } catch (e) {
                    console.error('Failed to save tasks', e);
                }
            }

            function persistState() {
                try {
                    localStorage.setItem(FILTER_KEY, JSON.stringify(state));
                } catch (e) {
                    // ignore
                }
            }

            function loadState() {
                try {
                    const raw = localStorage.getItem(FILTER_KEY);
                    if (!raw) return;
                    const parsed = JSON.parse(raw);
                    if (parsed.view) state.view = parsed.view;
                    if (parsed.category !== undefined) state.category = parsed.category;
                    if (parsed.done) state.done = parsed.done;
                    if (parsed.sort) state.sort = parsed.sort;
                } catch (e) {
                    // ignore
                }
            }

            function sanitizeTask(it) {
                return {
                    id: typeof it.id === 'string' && it.id ? it.id : uid(),
                    text: typeof it.text === 'string' && it.text.trim() ? it.text.trim() : '(empty)',
                    priority: VALID_PRIORITIES.includes(it.priority) ? it.priority : 'Low',
                    category: VALID_CATEGORIES.includes(it.category) ? it.category : 'General',
                    dueDate: typeof it.dueDate === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(it.dueDate) ? it.dueDate : '',
                    done: !!it.done,
                    createdAt: typeof it.createdAt === 'string' && !Number.isNaN(new Date(it.createdAt)) ? it.createdAt : new Date().toISOString()
                };
            }

            function load() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) return;
                    const parsed = JSON.parse(raw);
                    if (!Array.isArray(parsed)) return;
                    tasks = parsed.filter(Boolean).map(sanitizeTask);
                } catch (e) {
                    console.warn('Could not parse tasks from storage, resetting', e);
                    tasks = [];
                    localStorage.removeItem(STORAGE_KEY);
                }
            }

            function formatDate(d) {
                if (!d) return '';
                const date = new Date(d);
                if (Number.isNaN(date.getTime())) return '';
                return date.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
            }

            function getVisibleTasks() {
                return tasks.filter((task) => {
                    if (state.view === 'today' && !isToday(task.dueDate)) return false;
                    if (state.view === 'upcoming' && !isUpcoming(task.dueDate)) return false;
                    if (state.view === 'overdue' && !isOverdue(task.dueDate, task.done)) return false;
                    if (state.category && task.category !== state.category) return false;
                    if (state.done === 'active' && task.done) return false;
                    if (state.done === 'done' && !task.done) return false;
                    return true;
                });
            }

            function sortedTasks(list) {
                const copy = list.slice();
                if (state.sort === 'due') {
                    copy.sort((a, b) => {
                        if (!a.dueDate && !b.dueDate) return 0;
                        if (!a.dueDate) return 1;
                        if (!b.dueDate) return -1;
                        return a.dueDate.localeCompare(b.dueDate);
                    });
                } else if (state.sort === 'priority') {
                    copy.sort((a, b) => (PRIORITY_ORDER[a.priority] ?? 4) - (PRIORITY_ORDER[b.priority] ?? 4));
                }
                return copy;
            }

            function updateStats() {
                const total = tasks.length;
                const done = tasks.filter((t) => t.done).length;
                const active = total - done;
                const overdue = tasks.filter((t) => isOverdue(t.dueDate, t.done)).length;
                statTotal.textContent = total;
                statActive.textContent = active;
                statDone.textContent = done;
                statOverdue.textContent = overdue;
            }

            function updateViewLabel() {
                const labels = {
                    all: 'All Tasks',
                    today: 'Today',
                    upcoming: 'Upcoming',
                    overdue: 'Overdue'
                };
                currentViewLabel.textContent = labels[state.view] || 'Tasks';
            }

            function render() {
                taskList.innerHTML = '';
                const visible = sortedTasks(getVisibleTasks());
                updateStats();
                updateViewLabel();

                const doneCount = tasks.filter((t) => t.done).length;
                summaryEl.textContent = tasks.length
                    ? `${doneCount} of ${tasks.length} task${tasks.length === 1 ? '' : 's'} done`
                    : 'No tasks yet — add one above to get started.';

                if (visible.length === 0) {
                    const empty = document.createElement('li');
                    empty.className = 'empty-state';
                    empty.textContent = tasks.length === 0
                        ? 'Nothing here yet. Add your first task above.'
                        : 'No tasks match the current view and filters.';
                    taskList.appendChild(empty);
                    return;
                }

                visible.forEach((task) => {
                    const li = document.createElement('li');
                    li.setAttribute('data-id', task.id);
                    if (task.done) li.classList.add('done');

                    const toggle = document.createElement('input');
                    toggle.type = 'checkbox';
                    toggle.className = 'task-toggle';
                    toggle.checked = task.done;
                    toggle.addEventListener('change', () => toggleDone(task.id));

                    const info = document.createElement('div');
                    info.className = 'task-info';

                    if (task.editing) {
                        info.appendChild(buildEditRow(task));
                    } else {
                        const title = document.createElement('div');
                        title.className = 'task-title';
                        title.textContent = task.text;

                        const meta = document.createElement('div');
                        meta.className = 'task-meta';

                        const pr = document.createElement('span');
                        pr.className = priorityClassMap[task.priority] || 'priority-unknown';
                        pr.textContent = `${task.priority || 'Unknown'} Priority`;

                        const cat = document.createElement('span');
                        cat.textContent = `Category: ${task.category}`;

                        const due = document.createElement('span');
                        due.className = 'due-date';
                        due.textContent = task.dueDate ? `Due: ${formatDate(task.dueDate)}` : 'Due: No date';
                        if (isOverdue(task.dueDate, task.done)) {
                            due.classList.add('due-overdue');
                        }

                        meta.append(pr, cat, due);
                        info.append(title, meta);
                    }

                    const actions = document.createElement('span');
                    actions.className = 'actions';

                    if (!task.editing) {
                        const editBtn = document.createElement('button');
                        editBtn.type = 'button';
                        editBtn.textContent = 'Edit';
                        editBtn.addEventListener('click', () => startEdit(task.id));

                        const removeBtn = document.createElement('button');
                        removeBtn.type = 'button';
                        removeBtn.className = 'remove-btn';
                        removeBtn.textContent = 'Remove';
                        removeBtn.addEventListener('click', () => removeTask(task.id));

                        actions.append(editBtn, removeBtn);
                    }

                    li.append(toggle, info, actions);
                    taskList.appendChild(li);
                });
            }

            function buildEditRow(task) {
                const row = document.createElement('div');
                row.className = 'edit-row';

                const textInput = document.createElement('input');
                textInput.type = 'text';
                textInput.value = task.text;
                textInput.setAttribute('aria-label', 'Edit task description');

                const prioritySel = document.createElement('select');
                VALID_PRIORITIES.forEach((p) => {
                    const opt = document.createElement('option');
                    opt.value = p;
                    opt.textContent = p;
                    if (p === task.priority) opt.selected = true;
                    prioritySel.appendChild(opt);
                });

                const categorySel = document.createElement('select');
                VALID_CATEGORIES.forEach((c) => {
                    const opt = document.createElement('option');
                    opt.value = c;
                    opt.textContent = c;
                    if (c === task.category) opt.selected = true;
                    categorySel.appendChild(opt);
                });

                const dueInput = document.createElement('input');
                dueInput.type = 'date';
                dueInput.value = task.dueDate || '';

                const saveBtn = document.createElement('button');
                saveBtn.type = 'button';
                saveBtn.textContent = 'Save';
                saveBtn.addEventListener('click', () => saveEdit(task.id, {
                    text: textInput.value,
                    priority: prioritySel.value,
                    category: categorySel.value,
                    dueDate: dueInput.value
                }));

                const cancelBtn = document.createElement('button');
                cancelBtn.type = 'button';
                cancelBtn.textContent = 'Cancel';
                cancelBtn.addEventListener('click', () => cancelEdit(task.id));

                row.append(textInput, prioritySel, categorySel, dueInput, saveBtn, cancelBtn);
                return row;
            }

            function addTask(task) {
                tasks.unshift(task);
                persist();
                render();
            }

            taskForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const text = taskInput.value.trim();
                if (!text) return;
                const newTask = {
                    id: uid(),
                    text,
                    priority: prioritySelect.value,
                    category: categorySelect.value,
                    dueDate: dueDateInput.value || '',
                    done: false,
                    createdAt: new Date().toISOString()
                };
                addTask(newTask);
                taskForm.reset();
                taskInput.focus();
            });

            function toggleDone(id) {
                const t = tasks.find((item) => item.id === id);
                if (!t) return;
                t.done = !t.done;
                persist();
                render();
            }

            function removeTask(id) {
                const t = tasks.find((item) => item.id === id);
                if (!t) return;
                if (!confirm(`Remove "${t.text}"? This can't be undone.`)) return;
                tasks = tasks.filter((item) => item.id !== id);
                persist();
                render();
            }

            function startEdit(id) {
                tasks.forEach((item) => { if (item.id !== id) delete item.editing; });
                const t = tasks.find((item) => item.id === id);
                if (!t) return;
                t.editing = true;
                render();
            }

            function cancelEdit(id) {
                const t = tasks.find((item) => item.id === id);
                if (t) delete t.editing;
                render();
            }

            function saveEdit(id, updates) {
                const t = tasks.find((item) => item.id === id);
                if (!t) return;
                const text = (updates.text || '').trim();
                if (text) t.text = text;
                if (VALID_PRIORITIES.includes(updates.priority)) t.priority = updates.priority;
                if (VALID_CATEGORIES.includes(updates.category)) t.category = updates.category;
                t.dueDate = updates.dueDate || '';
                delete t.editing;
                persist();
                render();
            }

            clearBtn.addEventListener('click', () => {
                const doneCount = tasks.filter((t) => t.done).length;
                if (doneCount === 0) return;
                if (!confirm(`Clear ${doneCount} completed task${doneCount === 1 ? '' : 's'}? This can't be undone.`)) return;
                tasks = tasks.filter((t) => !t.done);
                persist();
                render();
            });

            filterDone.addEventListener('change', () => {
                state.done = filterDone.value;
                persistState();
                render();
            });

            sortBy.addEventListener('change', () => {
                state.sort = sortBy.value;
                persistState();
                render();
            });

            document.querySelectorAll('.nav-btn').forEach((btn) => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.nav-btn').forEach((b) => b.classList.remove('active'));
                    btn.classList.add('active');
                    state.view = btn.dataset.view;
                    persistState();
                    render();
                });
            });

            document.querySelectorAll('.category-btn').forEach((btn) => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.category-btn').forEach((b) => b.classList.remove('active'));
                    btn.classList.add('active');
                    state.category = btn.dataset.category || '';
                    persistState();
                    render();
                });
            });

            exportBtn.addEventListener('click', () => {
                const blob = new Blob([JSON.stringify(tasks, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'tasks.json';
                a.click();
                URL.revokeObjectURL(url);
            });

            importBtn.addEventListener('click', () => importFile.click());
            importFile.addEventListener('change', async (e) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;
                try {
                    const text = await file.text();
                    const imported = JSON.parse(text);
                    if (!Array.isArray(imported)) throw new Error('Invalid file format');
                    const sanitized = imported.filter(Boolean).map((item) => sanitizeTask({ ...item, id: undefined }));
                    tasks = sanitized.concat(tasks);
                    persist();
                    render();
                } catch (err) {
                    alert('Failed to import: ' + err.message);
                } finally {
                    importFile.value = '';
                }
            });

            loadState();
            load();
            filterDone.value = state.done;
            sortBy.value = state.sort;
            document.querySelectorAll('.nav-btn').forEach((btn) => {
                if (btn.dataset.view === state.view) btn.classList.add('active');
            });
            document.querySelectorAll('.category-btn').forEach((btn) => {
                if ((btn.dataset.category || '') === (state.category || '')) btn.classList.add('active');
            });
            render();

            window._taskApp = { getTasks: () => tasks, persist, render };
        })();
    </script>
</body>

</html>
