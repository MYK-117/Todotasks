<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Work To-Do App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 40px;
            color: #223;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        input,
        select {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
            background: #4f7cff;
            color: white;
            cursor: pointer;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .task-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .done {
            text-decoration: line-through;
            color: gray;
        }

        .priority-high {
            color: #d14343;
            font-weight: bold;
        }

        .priority-medium {
            color: #d28a00;
            font-weight: bold;
        }

        .priority-low {
            color: #2e8b57;
            font-weight: bold;
        }

        .actions button {
            margin-left: 6px;
            background: #e74c3c;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Work To-Do List</h1>
        <div class="form-grid">
            <input id="taskInput" placeholder="Add a work task..." />
            <select id="prioritySelect">
                <option value="Low">Low Priority</option>
                <option value="Medium">Medium Priority</option>
                <option value="High">High Priority</option>
            </select>
            <select id="categorySelect">
                <option value="General">General</option>
                <option value="Study">Study</option>
                <option value="Projects">Projects</option>
                <option value="Work">Work</option>
                <option value="Personal">Personal</option>
            </select>
            <input id="dueDateInput" type="date" />
            <button onclick="addTask()">Add Task</button>
        </div>
        <ul id="taskList"></ul>
    </div>

    <script>
        const taskInput = document.getElementById('taskInput');
        const prioritySelect = document.getElementById('prioritySelect');
        const categorySelect = document.getElementById('categorySelect');
        const dueDateInput = document.getElementById('dueDateInput');
        const taskList = document.getElementById('taskList');

        function addTask() {
            const taskText = taskInput.value.trim();
            if (!taskText) return;

            const priority = prioritySelect.value;
            const category = categorySelect.value;
            const dueDate = dueDateInput.value;

            const li = document.createElement('li');
            li.innerHTML = `
                <div class="task-info" onclick="toggleDone(this.parentElement)">
                    <strong>${taskText}</strong>
                    <span class="priority-${priority.toLowerCase()}">${priority} Priority</span>
                    <span>Category: ${category}</span>
                    <span>Due: ${dueDate || 'No date'}</span>
                </div>
                <span class="actions">
                    <button onclick="removeTask(this)">Remove</button>
                </span>
            `;

            taskList.appendChild(li);
            taskInput.value = '';
            prioritySelect.value = 'Low';
            categorySelect.value = 'General';
            dueDateInput.value = '';
            taskInput.focus();
        }

        function toggleDone(item) {
            item.classList.toggle('done');
        }

        function removeTask(button) {
            button.parentElement.parentElement.remove();
        }
    </script>
</body>

</html>
