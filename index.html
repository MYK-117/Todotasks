<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Work To-Do App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef4ff, #f7f0ff);
            margin: 0;
            padding: 40px;
            color: #223;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 28px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #4b3f72;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 18px;
        }

        input,
        select {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #d7dce5;
            border-radius: 10px;
        }

        button {
            padding: 10px 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #4f7cff, #6a8dff);
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .task-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            cursor: pointer;
        }

        .done {
            text-decoration: line-through;
            color: gray;
        }

        .priority-high {
            color: #d14343;
            font-weight: bold;
        }

        .priority-medium {
            color: #d28a00;
            font-weight: bold;
        }

        .priority-low {
            color: #2e8b57;
            font-weight: bold;
        }

        .actions button {
            margin-left: 6px;
            background: #e74c3c;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="logo">MYK Workspace</div>
            <div>📝 Task Board</div>
        </div>

        <div class="form-grid">
            <input id="taskInput" placeholder="Add a work task..." />
            <select id="prioritySelect">
                <option value="Low">Low Priority</option>
                <option value="Medium">Medium Priority</option>
                <option value="High">High Priority</option>
            </select>
            <select id="categorySelect">
                <option value="General">General</option>
                <option value="Study">Study</option>
                <option value="Projects">Projects</option>
                <option value="Work">Work</option>
                <option value="Personal">Personal</option>
            </select>
            <input id="dueDateInput" type="date" />
            <button onclick="addTask()">Add Task</button>
        </div>
        <ul id="taskList"></ul>
    </div>

    <script>
        const taskInput = document.getElementById('taskInput');
        const prioritySelect = document.getElementById('prioritySelect');
        const categorySelect = document.getElementById('categorySelect');
        const dueDateInput = document.getElementById('dueDateInput');
        const taskList = document.getElementById('taskList');
        const STORAGE_KEY = 'myk-task-list';

        function loadTasks() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (!saved) return;

            const tasks = JSON.parse(saved);
            tasks.forEach(task => renderTask(task));
        }

        function saveTasks() {
            const tasks = Array.from(taskList.children).map(li => ({
                text: li.querySelector('strong').textContent,
                priority: li.querySelector('.priority')?.textContent || 'Low',
                category: li.querySelector('.category')?.textContent || 'General',
                dueDate: li.querySelector('.due-date')?.textContent || '',
                done: li.classList.contains('done')
            }));
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        }

        function renderTask(task) {
            const li = document.createElement('li');
            li.className = task.done ? 'done' : '';
            li.innerHTML = `
                <div class="task-info" onclick="toggleDone(this.parentElement)">
                    <strong>${task.text}</strong>
                    <span class="priority ${task.priority.toLowerCase()}">${task.priority} Priority</span>
                    <span class="category">Category: ${task.category}</span>
                    <span class="due-date">Due: ${task.dueDate || 'No date'}</span>
                </div>
                <span class="actions">
                    <button onclick="removeTask(this)">Remove</button>
                </span>
            `;
            taskList.appendChild(li);
        }

        function addTask() {
            const taskText = taskInput.value.trim();
            if (!taskText) return;

            const task = {
                text: taskText,
                priority: prioritySelect.value,
                category: categorySelect.value,
                dueDate: dueDateInput.value,
                done: false
            };

            renderTask(task);
            saveTasks();
            taskInput.value = '';
            prioritySelect.value = 'Low';
            categorySelect.value = 'General';
            dueDateInput.value = '';
            taskInput.focus();
        }

        function toggleDone(item) {
            item.classList.toggle('done');
            saveTasks();
        }

        function removeTask(button) {
            button.parentElement.parentElement.remove();
            saveTasks();
        }

        loadTasks();
    </script>
</body>

</html>
